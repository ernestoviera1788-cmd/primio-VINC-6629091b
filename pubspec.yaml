name: primio_app
description: "A Primio-generated Flutter app."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # --- PRIMIO_ADDITIONS BEGIN (do not edit/remove) ---
  # PRIMIO_ADDED: flutter_localizations — Spanish Material texts and date picker
  flutter_localizations:
    sdk: flutter
  # PRIMIO_ADDED: image_picker — choosing profile photos from the gallery
  image_picker: ^1.2.3
  # --- PRIMIO_ADDITIONS END ---

  # Core packages (fully cross-platform)
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  provider: ^6.1.5+1

  # OS integration / UX helpers
  url_launcher: ^6.3.2
  awesome_notifications: ^0.12.1
  path: ^1.9.1
  collection: ^1.19.1
  async: ^2.13.1

  # Data persistence (cross-platform)
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.0.0

  # Remote database and networking
  http: ^1.6.0

  # Navigation (fully cross-platform)
  go_router: ^18.0.1

  # ─── Media (images / video / audio) ───
  image: ^4.9.2
  video_player: ^2.14.0

  # UI utilities (fully cross-platform)
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  flex_color_scheme: ^8.4.0
  flutter_hooks: ^0.21.3+1
  loading_animation_widget: ^1.3.0
  flutter_staggered_grid_view: ^0.7.0
  animations: ^3.0.0
  flutter_spinkit: ^5.2.2
  cached_network_image: ^4.0.0
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0
  shimmer_animation: ^2.2.2+1
  responsive_framework: ^1.5.1
  table_calendar: ^3.2.1
  carousel_slider: ^5.1.2

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  vector_math: ^2.4.2
  crypto: ^3.0.7
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
  - assets/icons/
  - assets/images/
